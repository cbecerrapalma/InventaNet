<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InventaNet Backoffice</title>
    <base href="/" />
    <meta name="theme-color" content="#1A237E" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div class="inv-loader" role="status" aria-live="polite">
            <span class="inv-loader__spinner" aria-hidden="true"></span>
            <span class="inv-loader__text">Cargando InventaNet…</span>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        // S93.2: ICU completo + cultura es-CL determinista antes del arranque.
        Blazor.start({ webAssembly: { applicationCulture: 'es-CL' } });
    </script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <div id="blazor-error-ui" class="inv-error-ui">
        <span>Ocurrió un error inesperado. Recargar</span>
        <a href="" class="inv-error-ui__reload">Recargar</a>
    </div>
</body>
</html>
